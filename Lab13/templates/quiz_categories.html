<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pick a Category</title>
</head>
<body>
    <h1>Pick a Category</h1>
    <ul>
        {% for cat in categories %}
            <li><a href="{{ url_for('pick_category', name=cat) }}">{{ cat.title() }}</a></li>
        {% endfor %}
    </ul>
    <p><a href="{{ url_for('index') }}">Back</a></p>
</body>
</html>
